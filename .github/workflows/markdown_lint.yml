name: Markdown lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Install markdownlint-cli
      run: npm install -g markdownlint-cli
    - name: Markdown lint
      run: make markdown-lint